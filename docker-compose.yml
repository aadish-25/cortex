services:
  # Vector Database for Hybrid Search (Dense 384d FastEmbed + Sparse BM25)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # In-Memory Cache for SSE Stream Rehydration, LangChain Buffer & Rate Limiting
  redis:
    image: redis:latest
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Production Relational Database (Optional for dev, matches production target)
  postgres:
    image: postgres:16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex_dev_password
      POSTGRES_DB: cortex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
    name: cortex_qdrant_data
  redis_data:
    name: cortex_redis_data
  postgres_data:
    name: cortex_postgres_data
