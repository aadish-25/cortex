services:
  # Vector Database for Hybrid Search (Dense 384d FastEmbed + Sparse BM25)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # In-Memory Cache for SSE Stream Rehydration, LangChain Buffer, Rate Limiting & Celery Broker
  redis:
    image: redis:latest
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Production Relational Database
  postgres:
    image: postgres:16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cortex_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Celery Background Worker (Async Document Reindexing & Vector Reconciliation)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex_dev_password}@postgres:5432/${POSTGRES_DB:-cortex_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
      - qdrant
    command: celery -A backend.worker.celery_app worker --beat -s /app/data/celerybeat-schedule --concurrency=1 --max-tasks-per-child=50 --loglevel=info
    mem_limit: 768m

volumes:
  qdrant_data:
    name: cortex_qdrant_data
  redis_data:
    name: cortex_redis_data
  postgres_data:
    name: cortex_postgres_data
