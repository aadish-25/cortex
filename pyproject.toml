[project]
name = "cortex"
version = "0.1.0"
description = "Enterprise RAG Assistant (AAD-H1)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.3.0",
    "fastapi>=0.110.0",
    "fastembed>=0.2.0",
    "google-genai>=0.1.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "litellm>=1.109.1",
    "passlib[bcrypt]>=1.7.4",
    "pdfplumber>=0.11.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.8.0",
    "redis>=5.0.0",
    "sqlmodel>=0.0.16",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
filterwarnings = [
    "ignore::UserWarning:pydantic.*",
    "ignore::DeprecationWarning",
]
